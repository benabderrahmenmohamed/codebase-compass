# Our own Semgrep rules.
#
# Why write our own instead of using the public registry:
#   1. speed    — a small local pack loads in ~0.6s, the registry in ~3s;
#   2. licence  — the public rules carry their own licence, these are ours;
#   3. control  — each rule carries ITS category and ITS penalty in metadata,
#      so scoring reads data instead of guessing.
#
# Semgrep reasons about the STRUCTURE of code (its syntax tree), not its text:
# an `eval(x)` written inside a comment or a string is not reported. That is
# the difference with a purely textual linter.
#
# The metadata fields we own:
#   category   : one of the five scored categories
#   severity   : low | medium | high | critical  (sent to the frontend)
#   penalty    : points deducted (see scoring.py)
#   suggestion : the fix offered to the user

rules:
  # ------------------------------------------------------------ SECURITY

  - id: dynamic-execution
    languages: [python, javascript, typescript]
    severity: ERROR
    message: "Dynamically built code is executed (eval/exec)."
    metadata:
      category: security
      severity: critical
      penalty: 10
      cwe: "CWE-95"
      suggestion: "Replace with an explicit conversion or a list of allowed values."
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: shell-command
    languages: [python]
    severity: ERROR
    message: "System command run through a shell: command injection is possible."
    metadata:
      category: security
      severity: critical
      penalty: 10
      cwe: "CWE-78"
      suggestion: "Pass arguments as a list and leave shell=False (the default)."
    pattern-either:
      - pattern: subprocess.$FUNCTION(..., shell=True, ...)
      - pattern: os.system(...)
      - pattern: os.popen(...)

  # Taint mode: Semgrep follows the value from where it is BUILT to where it
  # is EXECUTED. A plain text search cannot do this — it flagged a SQL string
  # written inside a documentation example, and that false positive became
  # the most severe finding in the whole report.
  #
  # Only a query that actually reaches a database call is reported, so a
  # concatenated string that is merely stored or printed is correctly ignored.
  - id: sql-string-concat
    mode: taint
    languages: [python]
    severity: ERROR
    message: "SQL query built by string concatenation: SQL injection is possible."
    metadata:
      category: security
      severity: critical
      penalty: 10
      cwe: "CWE-89"
      suggestion: "Use a parameterised query: execute(sql, (value,))."
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $SQL + $X
              - pattern: f"..."
              - pattern: $SQL % $X
              - pattern: $SQL.format(...)
          - metavariable-regex:
              metavariable: $SQL
              regex: (?is).*(select |insert into|update |delete from).*
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $OBJ.execute(...)
              - pattern: $OBJ.executemany(...)
              - pattern: $OBJ.executescript(...)
              - pattern: $OBJ.raw(...)

  - id: hardcoded-secret
    languages: [python]
    severity: WARNING
    message: "Secret written in plain text in the source code."
    metadata:
      category: security
      severity: high
      penalty: 7
      cwe: "CWE-798"
      suggestion: "Read the value from an environment variable (an unversioned .env file)."
    patterns:
      - pattern: $NAME = "..."
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(password|passwd|secret|api_?key|token|credential).*

  - id: hardcoded-secret-js
    languages: [javascript, typescript]
    severity: WARNING
    message: "Secret written in plain text in the source code."
    metadata:
      category: security
      severity: high
      penalty: 7
      cwe: "CWE-798"
      suggestion: "Read the value from an environment variable."
    patterns:
      - pattern-either:
          - pattern: const $NAME = "..."
          - pattern: let $NAME = "..."
          - pattern: var $NAME = "..."
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(password|secret|api_?key|token|credential).*

  - id: weak-hash
    languages: [python]
    severity: WARNING
    message: "Obsolete hashing algorithm (MD5 or SHA-1)."
    metadata:
      category: security
      severity: high
      penalty: 7
      cwe: "CWE-327"
      suggestion: "For a password use bcrypt or argon2; otherwise SHA-256."
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)

  - id: tls-verification-disabled
    languages: [python]
    severity: WARNING
    message: "TLS certificate verification is disabled."
    metadata:
      category: security
      severity: high
      penalty: 7
      cwe: "CWE-295"
      suggestion: "Keep verify=True and install the root certificate if needed."
    pattern: requests.$METHOD(..., verify=False, ...)

  # ------------------------------------------------------ BEST PRACTICES

  - id: broad-exception-catch
    languages: [python]
    severity: WARNING
    message: "Every error is caught without distinction."
    metadata:
      category: best_practices
      severity: medium
      penalty: 4
      suggestion: "Catch the expected error type so real bugs are not hidden."
    pattern-either:
      - pattern: |
          try:
              ...
          except:
              ...
      - pattern: |
          try:
              ...
          except Exception:
              ...

  - id: mutable-default-argument
    languages: [python]
    severity: WARNING
    message: "Mutable default value: it is shared between every call."
    metadata:
      category: best_practices
      severity: medium
      penalty: 4
      suggestion: "Default to None, then build the list or dict inside the function."
    # Block scalars are required: a pattern containing ": " would break YAML.
    pattern-either:
      - pattern: |
          def $F(..., $A=[], ...):
              ...
      - pattern: |
          def $F(..., $A={}, ...):
              ...

  - id: comparison-to-none
    languages: [python]
    severity: INFO
    message: "Comparison to None using == instead of is."
    metadata:
      category: best_practices
      severity: low
      penalty: 2
      suggestion: "Write 'is None' / 'is not None': identity is what is being tested."
    pattern-either:
      - pattern: $X == None
      - pattern: $X != None

  - id: debug-trace
    languages: [python, javascript, typescript]
    severity: INFO
    message: "Debug trace left in the code."
    metadata:
      category: best_practices
      severity: low
      penalty: 2
      suggestion: "Use a logger: configurable and switchable off in production."
    pattern-either:
      - pattern: print(...)
      - pattern: console.log(...)
      - pattern: console.debug(...)

  # ---------------------------------------------------------- PERFORMANCE
  #
  # Every rule below describes something that is ACTUALLY slower, not merely
  # something that looks untidy. Three obvious candidates were written and
  # then deleted for failing that test:
  #
  #   * `len(x)` in a loop condition — len() is O(1) in Python;
  #   * `open()` inside a loop — iterating over filenames is correct;
  #   * `x in [1, 2, 3]` — scanning three items beats building a set.
  #
  # Flagging those would have produced exactly the class of false positive
  # this rule pack was rewritten in taint mode to avoid.

  # The highest-value rule here. One query per iteration turns a page that
  # should make one round trip into one that makes hundreds — the "N+1"
  # problem, and the usual reason an endpoint is slow in production.
  - id: query-in-loop
    languages: [python]
    severity: WARNING
    message: "Database or network call inside a loop: one round trip per iteration."
    metadata:
      category: performance
      severity: high
      penalty: 6
      suggestion: "Fetch once outside the loop, or use a single bulk query with an IN clause."
    patterns:
      - pattern-either:
          - pattern-inside: |
              for $I in $SEQ:
                  ...
          - pattern-inside: |
              while $COND:
                  ...
      - pattern-either:
          - pattern: $OBJ.execute(...)
          - pattern: $OBJ.query(...)
          - pattern: $OBJ.fetchall(...)
          - pattern: $OBJ.fetchone(...)
          - pattern: $OBJ.get(...).first()
          - pattern: requests.$METHOD(...)
          - pattern: httpx.$METHOD(...)
          - pattern: urllib.request.urlopen(...)

  # Inserting at the front shifts every existing element along.
  - id: insert-at-front-of-list
    languages: [python]
    severity: INFO
    message: "Inserting at position 0 moves every other element: O(n) per call."
    metadata:
      category: performance
      severity: low
      penalty: 2
      suggestion: "collections.deque has appendleft(), which is O(1)."
    pattern: $LIST.insert(0, ...)

  # Scanning a list is O(n) per test; a set is a hash lookup. Reported as
  # low severity because it only matters when the collection is large,
  # which the rule cannot know — the suggestion says so rather than
  # asserting a problem.
  - id: membership-test-in-loop
    languages: [python]
    severity: INFO
    message: "Membership test against a list inside a loop: every test scans it."
    metadata:
      category: performance
      severity: low
      penalty: 2
      suggestion: "If the collection is large and unchanging, build a set once outside the loop."
    patterns:
      - pattern-either:
          - pattern-inside: |
              for $I in $SEQ:
                  ...
          - pattern-inside: |
              while $COND:
                  ...
      - pattern: $X in $HAYSTACK
      - metavariable-pattern:
          metavariable: $HAYSTACK
          pattern: $NAME
      - pattern-not: $X in $A.$B
      - pattern-not-inside: |
          for $X in $HAYSTACK:
              ...

  - id: regex-compiled-in-loop
    languages: [python]
    severity: INFO
    message: "Regular expression compiled inside a loop: rebuilt on every iteration."
    metadata:
      category: performance
      severity: low
      penalty: 2
      suggestion: "Compile once outside the loop and reuse the compiled pattern."
    patterns:
      - pattern-either:
          - pattern-inside: |
              for $I in $SEQ:
                  ...
          - pattern-inside: |
              while $COND:
                  ...
      - pattern: re.compile(...)

  # iterrows() builds a Series per row. On a large frame it is orders of
  # magnitude slower than a vectorised operation.
  - id: pandas-row-iteration
    languages: [python]
    severity: WARNING
    message: "Iterating a DataFrame row by row: this is the slow way to use pandas."
    metadata:
      category: performance
      severity: medium
      penalty: 4
      suggestion: "Use a vectorised operation, or .apply() where one is not available."
    pattern-either:
      - pattern: $DF.iterrows()
      - pattern: $DF.itertuples()

  # Awaiting in sequence when the calls do not depend on one another turns
  # parallel work into serial work. Medium rather than high: ordering is
  # sometimes deliberate, and the suggestion says so.
  - id: await-in-loop
    languages: [javascript, typescript]
    severity: WARNING
    message: "Awaited call inside a loop: each iteration waits for the previous one."
    metadata:
      category: performance
      severity: medium
      penalty: 4
      suggestion: "If the iterations are independent, collect the promises and await Promise.all once."
    patterns:
      - pattern-either:
          - pattern-inside: |
              for (...) { ... }
          - pattern-inside: |
              for (const $X of $Y) { ... }
          - pattern-inside: |
              for (let $X of $Y) { ... }
          - pattern-inside: |
              while (...) { ... }
      - pattern: await $CALL(...)

  # Querying the DOM is a tree search. Doing it per iteration repeats work
  # that could be done once.
  - id: dom-query-in-loop
    languages: [javascript, typescript]
    severity: INFO
    message: "DOM queried inside a loop: the document is searched on every iteration."
    metadata:
      category: performance
      severity: low
      penalty: 2
      suggestion: "Query once before the loop and reuse the result."
    patterns:
      - pattern-either:
          - pattern-inside: |
              for (...) { ... }
          - pattern-inside: |
              for (const $X of $Y) { ... }
          - pattern-inside: |
              for (let $X of $Y) { ... }
          - pattern-inside: |
              while (...) { ... }
      - pattern-either:
          - pattern: document.querySelector(...)
          - pattern: document.querySelectorAll(...)
          - pattern: document.getElementById(...)
